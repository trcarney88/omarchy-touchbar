[package]
name = "touchmeter-ui"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c", default-features = false, features = ["svg"] }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "2a44156b21d63b0342a366b26d9222a6edd4622c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 0
