name: Rust

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  simulator:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev mesa-vulkan-drivers libvulkan1
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Run simulator smoke test
        run: cargo run --release --locked -- simulate --help
      - name: Test UI crate
        run: cargo test --locked --manifest-path ui/Cargo.toml
  linux-hardware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libwayland-dev libdrm-dev libevdev-dev libsqlite3-dev mesa-vulkan-drivers libvulkan1
      - name: Check formatting
        run: cargo fmt --check
      - name: Test Linux hardware feature (no hardware access)
        run: cargo test --locked --features linux-hardware
      - name: Build Linux hardware feature
        run: cargo build --release --locked --features linux-hardware
